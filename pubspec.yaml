name: ally
description: "A student tracking app. From RSHS III"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.15.1
  firebase_auth: 5.6.2
  cloud_firestore: 5.6.11
  firebase_storage: ^12.3.9
  firebase_app_check: ^0.3.0+1
  flutter_map: 8.2.1
  flutter_map_tile_caching: ^10.1.1
  latlong2: 0.9.1
  http: ^1.5.0-beta
  font_awesome_flutter: 10.8.0
  geolocator: 14.0.2
  geocoding: 4.0.0
  flutter_local_notifications: ^17.2.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  share_plus: ^10.0.2
  path_provider: ^2.1.5
  flutter_background_service: ^5.0.6
  flutter_background_service_android: ^6.0.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    # Or your image file name
    - assets/background.png

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/ProductSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/ProductSans-Light.ttf
          weight: 300
        - asset: assets/fonts/ProductSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ProductSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ProductSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/ProductSans-Black.ttf
          weight: 900
        - asset: assets/fonts/ProductSans-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/ProductSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/ProductSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/ProductSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/ProductSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/ProductSans-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Inter
      fonts:
        - asset: fonts/Inter-Light.ttf
          weight: 300
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
